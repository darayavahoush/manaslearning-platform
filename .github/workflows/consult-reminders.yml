# Sends the "1 hour before" email + SMS reminders. Works on any hosting plan.
# Repo settings -> Secrets: SITE_URL (e.g. https://www.manaslearning.com) and CRON_SECRET (same value as the app's CRON_SECRET).
name: consult-reminders
on:
  schedule: [{cron: '*/5 * * * *'}]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/reminders"
